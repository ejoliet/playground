<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NoSpeaker hardware probe</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:1rem}button{padding:.7rem;margin:.3rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee;color:#222;padding:1rem}</style><h1>NoSpeaker: browser hardware probe</h1><p>Read-only experiment. No actuator commands are sent. A visible device is not proof of motor access.</p><button id="scan">Choose Apple HID device</button><button id="known">List previously authorized devices</button><button id="save">Export evidence</button><pre id="out"></pre><script>
const out=document.querySelector('#out');
const evidence={timestamp:new Date().toISOString(),userAgent:navigator.userAgent,secureContext:isSecureContext,webHID:!!navigator.hid,events:[]};
function render(){out.textContent=JSON.stringify(evidence,null,2)}
function collection(c){return {usagePage:c.usagePage,usage:c.usage,inputReports:c.inputReports.map(r=>r.reportId),outputReports:c.outputReports.map(r=>r.reportId),featureReports:c.featureReports.map(r=>r.reportId),children:c.children.map(collection)}}
function describe(d){return {productName:d.productName,vendorId:d.vendorId,productId:d.productId,collections:d.collections.map(collection)}}
async function probe(mode){try{if(!navigator.hid)throw Error('WebHID unavailable');const devices=mode==='choose'?await navigator.hid.requestDevice({filters:[{vendorId:0x05ac}]}):await navigator.hid.getDevices();evidence.events.push({mode,devices:devices.filter(d=>d.vendorId===0x05ac).map(describe)});}catch(e){evidence.events.push({mode,error:e.name+': '+e.message})}render()}
document.querySelector('#scan').onclick=()=>probe('choose');document.querySelector('#known').onclick=()=>probe('known');document.querySelector('#save').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(evidence,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='hid-evidence.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
