[project]
name = "duckdb-healpix-value"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb==1.5.6",
    "pyarrow==26.0.1",
    "cdshealpix==0.9.0",
    "mocpy==0.21.0",
    "astropy==8.0.2",
    "astropy-healpix==2.0.1",
    "numpy==2.5.4",
    "matplotlib==3.11.2",
    "pytest==9.2.0",
    "scipy==1.18.1",
    "lsdb==0.11.1",
    "pyacid==0.6.1",
]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
