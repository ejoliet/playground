[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curatevid"
version = "0.1.0"
description = "Auditable local video curation with ffmpeg, PySceneDetect and Whisper"
requires-python = ">=3.10"
dependencies = ["scenedetect>=0.7.3,<0.8", "opencv-python>=5.0,<6", "numpy>=1.26,<3", "pyarrow>=26,<27", "faster-whisper>=1.1,<2", "av>=15,<17", "psutil>=6,<8"]

[project.scripts]
curatevid = "curatevid:main"

[tool.setuptools]
py-modules = ["curatevid"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
