apiVersion: v1
kind: Namespace
metadata:
  name: production-demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: settings
  namespace: production-demo
data:
  auth_enabled: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: production-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reader
  namespace: production-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
